<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Act 1 motion test: lines from his feet</title>
<!-- Each line is a moving stroke: it leaves his feet, runs to the foot of its vertical, turns and runs up it.
     The part behind the stroke disappears. window.setT(t) draws the state at t seconds (for frame rendering). -->
<style>
  html,body{margin:0;background:#e9d4ba;overflow:hidden}
  .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
  svg{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div class="stage"><img src="base-frame.png" width="1920" height="1080" style="position:absolute;left:0;top:0">
<svg id="s" width="1920" height="1080" style="mix-blend-mode:multiply"><defs>
  <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/>
    <image href="../opening/man.png" x="743" y="750" width="257" height="184" style="filter:contrast(3) brightness(1.15)"/></mask></defs>
  <g id="plan"></g><g id="g" mask="url(#behind)"></g></svg></div>
<script>
const K = 0.65, AX = 1006.5, TOP = 60;
const F = (x, y) => [955 + (x - AX) * K, TOP + (y - 86) * K];
const V = [106.1,129.6,374.1,458.3,541.0,590.0,625.9,669.1,708.6,758.4,792.8,875.5,894.6,920.9,939.2,1006.5,1073.9,1093.0,1109.1,1131.0,1176.4,1213.8,1255.5,1295.0,1344.8,1381.4,1423.1,1462.7,1549.0,1631.0,1884.3,1907.0];
const FEET = [955, 922];
const SPEED = 820;          // px per second along the path
const TAIL = 150;           // length of the moving stroke
const NS = "http://www.w3.org/2000/svg", g = document.getElementById("g");
// Launch order: the copper axis, then outward in pairs, with a hand-drawn irregular rhythm
const order = V.map((x, i) => ({ x, d: Math.abs(x - AX) })).sort((a, b) => a.d - b.d);
const START = {};
let clock = 0, jit = 7;
order.forEach((o, k) => {
  if (k > 0 && (k % 2 === 1)) { jit = (jit * 16807) % 2147483647; clock += 0.07 + (jit / 2147483647) * 0.09; }
  START[o.x] = clock + (k % 2 === 0 && k > 0 ? 0.03 : 0);
});
// The plan's real lines stay behind the climbing strokes
const planG = document.getElementById("plan"), defs = document.querySelector("defs");
const pm = document.createElementNS(NS, "mask"); pm.id = "reveal"; pm.setAttribute("maskUnits", "userSpaceOnUse");
pm.setAttribute("x", 0); pm.setAttribute("y", 0); pm.setAttribute("width", 1920); pm.setAttribute("height", 1080); defs.appendChild(pm);
const img = document.createElementNS(NS, "image"); img.setAttribute("href", "masterplan-ink.png");
img.setAttribute("x", 955 - AX * K); img.setAttribute("y", TOP - 86 * K); img.setAttribute("width", 2000 * K); img.setAttribute("height", 1124.4 * K);
img.setAttribute("mask", "url(#reveal)"); planG.appendChild(img);
const lines = V.map((x) => {
  const [bx, by] = F(x, 1045), [, ty] = F(x, 86);
  const ray = Math.hypot(bx - FEET[0], by - FEET[1]), up = by - ty;
  const copper = Math.abs(x - AX) < 1;
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", `M${FEET[0]} ${FEET[1]} L${bx.toFixed(1)} ${by.toFixed(1)} L${bx.toFixed(1)} ${ty.toFixed(1)}`);
  p.setAttribute("fill", "none"); p.setAttribute("stroke", copper ? "#762F0B" : "#3a4b7a");
  p.setAttribute("stroke-width", copper ? 2.4 : 1.4); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  g.appendChild(p);
  const r = document.createElementNS(NS, "rect"); r.setAttribute("x", bx - 5); r.setAttribute("width", 10); r.setAttribute("fill", "#fff");
  r.setAttribute("y", by); r.setAttribute("height", 0); pm.appendChild(r);
  return { p, r, x, by, ray, len: ray + up };
});
window.setT = (t) => {
  for (const L of lines) {
    const head = Math.min(Math.max(0, t - START[L.x]) * SPEED, L.len + TAIL);   // where the pen is
    const climbed = Math.max(0, Math.min(head, L.len) - L.ray);                  // how far up its vertical
    L.r.setAttribute("y", (L.by - climbed).toFixed(1)); L.r.setAttribute("height", climbed.toFixed(1));
    const a = Math.max(0, head - TAIL), b = Math.min(head, L.len);   // the visible stroke: [a, b] along the path
    if (b <= a) { L.p.style.opacity = 0; continue; }
    L.p.style.opacity = 1;
    L.p.setAttribute("stroke-dasharray", `0 ${a.toFixed(1)} ${(b - a).toFixed(1)} ${L.len + TAIL}`);
  }
};
window.DURATION = Math.max(...lines.map((l) => START[l.x] + (l.len + TAIL) / SPEED));
setT(0);
</script>
</body>
</html>
