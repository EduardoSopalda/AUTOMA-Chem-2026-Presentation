<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Act 1: The Architect</title>
<!-- Act 1, three clicks, inside the permanent frame (base-frame.png). window.setState(click, t) draws any moment.
     CLICK 1  "01" (above the spheres) glows and fades; only when it is gone do the spheres glide to their places.
     CLICK 2  The plan unfolds slowly behind the speaker, about 45 s:
              the copper axis rises from his feet; verticals draw bottom to top, outward in pairs;
              horizontals draw from both paper margins inward, meeting at the axis.
              The spheres react to the lines as they come: copper withdraws calmly into Governance,
              blue flinches, waits trembling, and is caught by a rule from the east and dragged into the Plant zone.
     CLICK 3  The construction strips resolve into the full plan; labels; the statement, line by line. -->
<style>
  @font-face{font-family:"Source Serif 4";src:url("../fonts/SourceSerif4.ttf") format("truetype");font-weight:200 900}
  @font-face{font-family:"DM Sans";src:url("../fonts/dm-sans-latin-100-normal.woff2") format("woff2");font-weight:100}
  @font-face{font-family:"DM Sans";src:url("../fonts/DMSans-400.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"DM Sans";src:url("../fonts/DMSans-500.woff2") format("woff2");font-weight:500}
  html,body{margin:0;background:#e9d4ba;overflow:hidden}
  .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
  svg,img.s{position:absolute;left:0;top:0}
  img.s{z-index:2}
  .sh{mix-blend-mode:multiply}
  /* 01 sits above the spheres */
  .one{position:absolute;z-index:5;left:50px;top:40px;font:100 470px/0.8 "DM Sans",sans-serif;letter-spacing:-.02em;
       background:linear-gradient(115deg,#8a3a12 0%,#c4733e 30%,#e8ae7c 44%,#b5602c 58%,#762F0B 100%);
       -webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
  /* The note: an intentional anchor, legible from the back of the room */
  .note{position:absolute;z-index:3;left:110px;top:618px;font:500 38px/1 "DM Sans",sans-serif;letter-spacing:.02em;color:#0F0F11;opacity:0}
  .note::before{content:"";position:absolute;left:0;top:-22px;width:56px;height:2px;background:#762F0B}
  .col{position:absolute;z-index:3;left:1594px;top:212px;width:300px;white-space:nowrap}
  .act{font:500 16px/1 "DM Sans",sans-serif;letter-spacing:.24em;color:#365F7C;opacity:0}
  .hair{height:1px;background:#365F7C;margin:12px 0 20px;opacity:0}
  .title{font:500 46px/1.05 "Source Serif 4",Georgia,serif;color:#0F0F11;letter-spacing:-.01em;opacity:0}
  .copper{height:2px;background:#762F0B;margin:16px 0 26px;width:0}
  .stmt div{font:400 23px/1.4 "Source Serif 4",Georgia,serif;color:#0F0F11;opacity:0}
  .lbl{position:absolute;z-index:3;font:italic 400 9.5px/1.1 "Source Serif 4",Georgia,serif;color:#2c3a66;text-align:center;width:56px;opacity:0}
</style>
</head>
<body>
<div class="stage" id="stage"><img src="base-frame.png" width="1920" height="1080" style="position:absolute;left:0;top:0">
<svg id="s" width="1920" height="1080" style="mix-blend-mode:multiply"><defs>
  <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/>
    <image href="../opening/man.png" x="743" y="750" width="257" height="184" style="filter:contrast(3) brightness(1.15)"/></mask></defs>
  <g id="full" opacity="0"></g><g id="plan"></g><g id="g" mask="url(#behind)"></g></svg>
  <div class="one" id="one">01</div><div class="note" id="note">…not as a metaphor.</div>
  <div class="col"><div class="act" id="act">ACT ONE</div><div class="hair" id="hair"></div><div class="title" id="ttl">The Architect</div><div class="copper" id="rule"></div>
    <div class="stmt"><div>We design from above.</div><div>Not always for the person</div><div>who has to live</div><div>with the result.</div></div></div>
</div>
<script>
const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
const K = 0.65, AX = 1006.5, TOP = 60;
const F = (x, y) => [955 + (x - AX) * K, TOP + (y - 86) * K];
const FEET = [955, 922], ink = "#3a4b7a";
const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };   // quadratic in and out
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const g = $("g"), defs = document.querySelector("defs");
const reveal = mk("mask", { id: "reveal", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1920, height: 1080 }, defs);
const planAttrs = { href: "masterplan-ink.png", x: 955 - AX * K, y: TOP - 86 * K, width: 2000 * K, height: 1124.4 * K };
mk("image", { ...planAttrs, mask: "url(#reveal)" }, $("plan"));
mk("image", planAttrs, $("full"));
const [PL] = F(98, 86), [PR] = F(1914, 1045), [, PT] = F(0, 86), AXX = 955;

// ================= CLICK 2 timing: the plan unfolds over about 45 s =================
const AXIS = { t0: 0.5, dur: 5.0 };                 // the copper axis rises from his feet
const VDUR = 3.6, V0 = 4.0, VGAP = 1.3;             // verticals: bottom to top, outward in pairs
const HDUR = 3.2, H0 = 21.0, HGAP = 2.2;            // horizontals: from both margins to the axis, in sync
const V = [106.1,129.6,374.1,458.3,541.0,590.0,625.9,669.1,708.6,758.4,792.8,875.5,894.6,920.9,939.2,1073.9,1093.0,1109.1,1131.0,1176.4,1213.8,1255.5,1295.0,1344.8,1381.4,1423.1,1462.7,1549.0,1631.0,1884.3,1907.0];
const ROWS = [113.5, 95.2, 392.4, 475.1, 557.1, 641.3, 720.4, 801.6, 964.1, 1022.7];

// The axis: from his feet up the avenue to the plan's top edge
const axisLen = FEET[1] - PT;
const axisPath = mk("path", { d: `M${FEET[0]} ${FEET[1]} L${AXX} ${PT}`, fill: "none", stroke: "#762F0B", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-dasharray": `0 ${axisLen + 10}` }, g);

// Verticals, launched in pairs outward from the axis
const byDist = V.map((x) => ({ x, d: Math.abs(x - AX) })).sort((a, b) => a.d - b.d);
const verts = byDist.map((o, i) => {
  const [X, B] = F(o.x, 1045), [, T] = F(o.x, 86);
  const t0 = V0 + Math.floor(i / 2) * VGAP + (i % 2) * 0.35;
  const r = mk("rect", { x: X - 4, width: 8, y: B, height: 0, fill: "#fff" }, reveal);
  const pen = mk("line", { x1: X, x2: X, y1: B, y2: B, stroke: ink, "stroke-width": 1.6, "stroke-linecap": "round", opacity: 0 }, g);
  return { X, B, T, t0, r, pen };
});
const vAt = (X) => verts.reduce((a, v) => (Math.abs(v.X - X) < Math.abs(a.X - X) ? v : a));
function inv(p) { let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (ease(m) < p) lo = m; else hi = m; } return lo; }
const vReach = (v, Y) => v.t0 + VDUR * inv((v.B - Y) / (v.B - v.T));   // when a vertical's pen reaches height Y

// Horizontals: two halves, from each margin to the axis, drawn in parallel
const rows = ROWS.map((y, k) => {
  const Y = F(0, y)[1], t0 = H0 + k * HGAP;
  const rl = mk("rect", { x: PL, y: Y - 4, width: 0, height: 8, fill: "#fff" }, reveal);
  const rr = mk("rect", { x: PR, y: Y - 4, width: 0, height: 8, fill: "#fff" }, reveal);
  const pl = mk("line", { y1: Y, y2: Y, stroke: ink, "stroke-width": 1.6, "stroke-linecap": "round", opacity: 0 }, g);
  const pr = mk("line", { y1: Y, y2: Y, stroke: ink, "stroke-width": 1.6, "stroke-linecap": "round", opacity: 0 }, g);
  return { y, Y, t0, rl, rr, pl, pr };
});
const rowAt = (y) => rows.find((r) => Math.abs(r.y - y) < 0.5);
const hReach = (r, X) => r.t0 + HDUR * inv(X < AXX ? (X - PL) / (AXX - PL) : (PR - X) / (PR - AXX));

// ================= The spheres =================
const SPH = { copper: { w: 168, h: 193, c: 84.5, r: 44.5 }, blue: { w: 166, h: 191, c: 83.5, r: 44 } };
function sprite(n) { const o = SPH[n]; const sh = document.createElement("img"); sh.src = `shadow-${n}.png`; sh.className = "s sh"; $("stage").appendChild(sh);
  const im = document.createElement("img"); im.src = `sphere-${n}.png`; im.className = "s"; $("stage").appendChild(im); return { o, sh, im }; }
function place(sp, x, y, r, sx = 1, sy = 1) {
  const k = r / sp.o.r, L = x - sp.o.c * k, T = y - sp.o.c * k;
  for (const e of [sp.sh, sp.im]) { e.style.width = sp.o.w * k + "px"; e.style.height = sp.o.h * k + "px"; }
  sp.im.style.transformOrigin = `${sp.o.c * k}px ${sp.o.c * k}px`;
  sp.im.style.transform = `translate(${L}px,${T}px) scale(${sx},${sy})`;
  sp.sh.style.transform = `translate(${L}px,${T + (1 - sy) * r}px) scale(${sx},1)`;
}
const copper = sprite("copper"), blue = sprite("blue");
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const a = keys[i - 1], b = keys[i], u = smooth((t - a[0]) / (b[0] - a[0])); return [1, 2, 3, 4].map((j) => a[j] + (b[j] - a[j]) * u); }
  return keys[keys.length - 1].slice(1);
}
const C0 = [643, 550], B0 = [1280, 547];          // exactly where clip 2 leaves them: no opening move
const HOME_C = F(285, 240), HOME_B = F(1756, 896);

// Copper, the confident planner: it withdraws ahead of the lines, calmly, with a lean before each move,
// and is inside Governance well before the row at y 259 closes the door. Then it glances back.
const cA = vReach(vAt(684), 520), cB = vReach(vAt(652), 520), cC = vReach(vAt(598), 480);
const closeC = hReach(rowAt(392.4), HOME_C[0]);
const CK = [
  [0, C0[0], C0[1], 1, 1],
  [cA - 0.6, C0[0], C0[1], 1, 1],
  [cA - 0.2, C0[0] + 5, C0[1] + 2, 0.95, 1.05],        // leans
  [cA + 1.6, 598, 470, 1, 1],                            // withdraws, unhurried
  [cB - 0.2, 598, 470, 1, 1],
  [cB + 1.6, 552, 360, 1, 1],
  [cC - 0.4, 552, 360, 1, 1],
  [cC + 1.4, HOME_C[0] + 6, HOME_C[1] - 4, 1.03, 0.97],   // steps into Governance, a small overshoot
  [cC + 2.3, HOME_C[0], HOME_C[1], 1, 1],
  [closeC + 0.4, HOME_C[0], HOME_C[1], 1, 1],
  [closeC + 1.1, HOME_C[0] + 5, HOME_C[1], 1, 1],       // the door closes behind it: it glances back at the avenue
  [closeC + 2.0, HOME_C[0], HOME_C[1], 1, 1],
];
// Blue, the anxious operator: flinches as rules pass close, overcorrects, waits trembling,
// is caught by the row at y 472 coming in from the east margin, resists, is dragged down into the Plant box.
const bA = vReach(vAt(1252), 500), bB = vReach(vAt(1308), 500), bC = vReach(vAt(1361), 520);
const catcher = rowAt(801.6), hit = hReach(catcher, 1410 + 44);   // the row at blue's height, from the east
const BK = [
  [0, B0[0], B0[1], 1, 1],
  [bA - 0.05, B0[0], B0[1], 1, 1],
  [bA + 0.12, B0[0] + 26, B0[1] - 2, 1.09, 0.91],       // flinch
  [bA + 0.45, B0[0] + 40, B0[1] + 3, 1, 1],             // overcorrects
  [bA + 0.8, B0[0] + 33, B0[1] + 1, 1, 1],
  [bB - 0.05, B0[0] + 33, B0[1] + 1, 1, 1],
  [bB + 0.12, B0[0] + 70, B0[1] + 2, 1.09, 0.91],       // flinch again
  [bB + 0.5, B0[0] + 86, B0[1] + 6, 1, 1],
  [bB + 0.9, B0[0] + 80, B0[1] + 4, 1, 1],
  [bC - 0.05, B0[0] + 80, B0[1] + 4, 1, 1],
  [bC + 0.15, B0[0] + 136, B0[1] + 3, 1.08, 0.92],      // and again: now inside the Plant zone's walls, waiting
  [bC + 0.6, 1410, 550, 1, 1],
  [hit - 0.03, 1410, 550, 1, 1],
  [hit + 0.15, 1413, 558, 1.14, 0.84],                  // caught: squashed against the rule
  [hit + 0.8, 1418, 566, 1.08, 0.92],                   // resists, barely moving
  [hit + 1.9, HOME_B[0] + 2, HOME_B[1] - 18, 1.02, 0.98],   // gives way, dragged down
  [hit + 2.3, HOME_B[0] + 3, HOME_B[1] + 11, 0.94, 1.06],   // hits the bottom of the box
  [hit + 2.7, HOME_B[0] - 1, HOME_B[1] - 2, 1.02, 0.98],
  [hit + 3.1, HOME_B[0], HOME_B[1], 1, 1],
];

function click2(t) {
  // the axis
  const ap = ease((t - AXIS.t0) / AXIS.dur) * axisLen;
  axisPath.setAttribute("stroke-dasharray", `${ap} ${axisLen + 10}`);
  // verticals: bottom to top; a short pen stroke leads, the plan's real line stays behind it
  for (const v of verts) {
    const p = ease((t - v.t0) / VDUR), y = v.B - (v.B - v.T) * p;
    v.r.setAttribute("y", y); v.r.setAttribute("height", v.B - y);
    const live = p > 0 && p < 1;
    v.pen.setAttribute("opacity", live ? 1 : 0); v.pen.setAttribute("y1", y); v.pen.setAttribute("y2", Math.min(v.B, y + 70));
  }
  // horizontals: both halves in parallel, from the margins to the axis
  for (const r of rows) {
    const p = ease((t - r.t0) / HDUR), xl = PL + (AXX - PL) * p, xr = PR - (PR - AXX) * p;
    r.rl.setAttribute("width", xl - PL); r.rr.setAttribute("x", xr); r.rr.setAttribute("width", PR - xr);
    const live = p > 0 && p < 1;
    for (const [pen, x, dir] of [[r.pl, xl, -1], [r.pr, xr, 1]]) { pen.setAttribute("opacity", live ? 1 : 0); pen.setAttribute("x1", x); pen.setAttribute("x2", x + dir * 70); }
  }
  // the spheres
  const c = track(CK, t); place(copper, c[0], c[1], 44 - 6 * smooth((t - cC) / 1.4), c[2], c[3]);
  const b = track(BK, t), tr = t > bA - 1 ? 1.3 * Math.sin(t * 61) * (t < hit + 3.1 ? 1 : 0.5) : 0;
  place(blue, b[0] + tr, b[1], 43.5 - 1.5 * smooth((t - hit) / 3), b[2], b[3]);
  // ACT ONE and The Architect arrive in the column early in the drawing; the copper rule draws under the title
  const e = (a, d) => smooth((t - a) / d);
  $("act").style.opacity = e(1.0, 1.2); $("hair").style.opacity = 0.55 * e(1.4, 1.2); $("ttl").style.opacity = e(2.0, 1.4);
  $("rule").style.width = 100 * e(3.2, 2.5) + "%";
}

// ================= CLICK 1 =================
const ONE_IN = 0.6, ONE_HOLD = 2.5, ONE_OUT = 1.0;
const ONE_GONE = ONE_IN + ONE_HOLD + ONE_OUT;          // the spheres wait for this moment
function click1(t) {
  const one = smooth(t / ONE_IN) * (1 - smooth((t - ONE_IN - ONE_HOLD) / ONE_OUT));
  $("one").style.opacity = one;
  $("one").style.filter = `blur(${2.5 * smooth((t - ONE_IN - ONE_HOLD - 0.2) / (ONE_OUT - 0.2))}px)`;   // sinks into the grain
  $("note").style.opacity = smooth((t - ONE_GONE - 0.2) / 1.0);   // after 01 has gone
  place(copper, C0[0], C0[1], 44);                     // the spheres do not move in click 1
  place(blue, B0[0], B0[1], 43.5);
}

// ================= CLICK 3 =================
const LABELS = [[248, 140, "Ministry of Governance"], [335, 140, "Executive Direction"], [158, 211, "Ministry of Governance"],
  [421, 213, "Operational Risk"], [504, 184, "Ministry of Administration"], [159, 300, "Ministry of Governance"],
  [421, 302, "Ministry of Governance"], [502, 310, "Ministry of Governance"], [250, 359, "Operational Risk"],
  [332, 359, "Executive Direction"], [1761, 819, "Plant Interface Zone"]];
const lbls = LABELS.map(([x, y, s]) => { const [X, Y] = F(x, y), w = s.startsWith("Plant"); const d = document.createElement("div"); d.className = "lbl";
  d.style.left = X - (w ? 45 : 28) + "px"; d.style.top = Y - 6 + "px"; if (w) d.style.width = "90px";
  d.innerHTML = w ? s : s.replace(" of ", " of<br>").replace("Executive ", "Executive<br>").replace("Operational ", "Operational<br>"); $("stage").appendChild(d); return d; });
function click3(t) {
  $("full").setAttribute("opacity", smooth(t / 1.4));
  lbls.forEach((d) => (d.style.opacity = smooth((t - 0.9) / 0.7)));
  document.querySelectorAll(".stmt div").forEach((d, i) => (d.style.opacity = smooth((t - 1.2 - i * 0.2) / 0.7)));
}

const CLICK2 = Math.max(hit + 3.4, ...rows.map((r) => r.t0 + HDUR), ...verts.map((v) => v.t0 + VDUR)) + 0.5;
window.CLICK = { 1: ONE_GONE + 1.3, 2: CLICK2, 3: 2.6 };
window.setState = (c, t) => {
  if (c === 1) { click2(-1); $("act").style.opacity = 0; $("hair").style.opacity = 0; $("ttl").style.opacity = 0; $("rule").style.width = 0; click1(t); click3(-1); return; }
  click1(99); click2(c === 2 ? t : 999);
  $("one").style.opacity = 0;
  click3(c === 3 ? t : -1);
};
setState(1, 0);
// Fit the 1920 x 1080 stage to any window, centred
const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080), st = $("stage");
  st.style.transformOrigin = "0 0"; st.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`; };
addEventListener("resize", fit); fit();
// Live playback: Space, Right arrow or Page Down starts the next click; R resets. Each click plays once and holds.
let click = 0, clickStart = 0, raf = 0;
function frame(now) {
  const t = (now - clickStart) / 1000;
  setState(click, Math.min(t, window.CLICK[click] + 0.01));
  raf = t < window.CLICK[click] ? requestAnimationFrame(frame) : 0;
}
addEventListener("keydown", (e) => {
  if ([" ", "ArrowRight", "PageDown", "Enter"].includes(e.key)) {
    e.preventDefault(); if (e.repeat || click >= 3) return;
    if (click > 0) setState(click, window.CLICK[click] + 1);          // an early click completes the current one
    click++; clickStart = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  } else if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  } else if (e.key === "r" || e.key === "R") { cancelAnimationFrame(raf); click = 0; setState(1, 0); }
});
</script>
</body>
</html>
