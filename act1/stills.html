<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Act 1 stills</title>
<!-- Act 1 stills for Edu's approval. Nothing animates here. ?s=A..E
     The frame (title, name, logo, event lines, the man) is permanent: base-frame.png.
     Everything else happens in the field inside it: what is going on in his head. -->
<style>
  @font-face{font-family:"Source Serif 4";src:url("../fonts/SourceSerif4.ttf") format("truetype");font-weight:200 900}
  @font-face{font-family:"DM Sans";src:url("../fonts/dm-sans-latin-100-normal.woff2") format("woff2");font-weight:100}
  @font-face{font-family:"DM Sans";src:url("../fonts/DMSans-400.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"DM Sans";src:url("../fonts/DMSans-500.woff2") format("woff2");font-weight:500}
  html,body{margin:0;background:#e9d4ba;overflow:hidden}
  .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
  .abs{position:absolute}
  .shadow{mix-blend-mode:multiply}
  .ink{mix-blend-mode:multiply}

  /* 01: DM Sans Thin, heated copper, no bloom */
  .one{left:37px;top:36px;font:100 760px/0.8 "DM Sans",sans-serif;letter-spacing:-.02em;
       background:linear-gradient(115deg,#8a3a12 0%,#c4733e 30%,#e8ae7c 44%,#b5602c 58%,#762F0B 100%);
       -webkit-background-clip:text;background-clip:text;color:transparent;
       filter:drop-shadow(0 0 5px rgba(216,156,103,.30))}

  /* ...not as a metaphor: a small survey note */
  .note{left:110px;top:668px;font:400 22px/1 "DM Sans",sans-serif;letter-spacing:.06em;color:#0F0F11}

  /* The right column, under Edu's name */
  .col{left:1594px;top:212px;width:300px;white-space:nowrap}
  .act{font:500 16px/1 "DM Sans",sans-serif;letter-spacing:.24em;color:#365F7C}
  .hair{height:1px;background:#365F7C;opacity:.55;margin:12px 0 20px}
  .title{font:500 46px/1.05 "Source Serif 4",Georgia,serif;color:#0F0F11;letter-spacing:-.01em}
  .copper{height:2px;background:#762F0B;margin:16px 0 26px}
  .stmt{font:400 23px/1.4 "Source Serif 4",Georgia,serif;color:#0F0F11}

  .lbl{font:italic 400 9.5px/1.1 "Source Serif 4",Georgia,serif;color:#2c3a66;text-align:center;width:56px}
  .cap{position:absolute;right:16px;bottom:6px;font:12px system-ui;color:rgba(80,60,40,.55)}
</style>
</head>
<body>
<div class="stage" id="stage"><img class="abs" src="base-frame.png" style="left:0;top:0;width:1920px;height:1080px"></div>
<script>
const q = new URLSearchParams(location.search), s = q.get("s") || "A";
const st = document.getElementById("stage");
const add = (h) => st.insertAdjacentHTML("beforeend", h);
const NS = "http://www.w3.org/2000/svg";

// The plan inside the field: its central axis (1006.5 in the 2000 px preview) sits exactly on the man (x 955)
const K = 0.65, AX = 1006.5, TOP = 60;
const F = (x, y) => [955 + (x - AX) * K, TOP + (y - 86) * K];
const IMG = { w: 2732 / 2000, left: F(0, 0)[0], top: F(0, 0)[1] };        // image placement: 2000 px preview space -> stage
const imgW = 2000 * K, imgH = 1124.4 * K;

// The plan's own lines (tools: act1/plan-lines.json), in the order they are drawn
const AXIS = 1006.5;
const THREE = [939, 1074];
const SIX = [904, 1109, 800, 1214];
const CUTS = [113, 402, 557, 729, 964, 1023];

function plan(lines) {        // lines: {v:[x...], h:[y...]} to reveal, or "all"
  const id = "m" + Math.random().toString(36).slice(2, 7);
  let mask = "";
  if (lines !== "all") {
    for (const x of lines.v) mask += `<rect x="${x - 6}" y="86" width="12" height="959" fill="#fff"/>`;
    for (const y of lines.h) mask += `<rect x="98" y="${y - 6}" width="1816" height="12" fill="#fff"/>`;
  }
  add(`<svg class="abs ink" width="1920" height="1080" style="left:0;top:0">
    <defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="2000" height="1125">${mask}</mask></defs>
    <g transform="translate(${F(0, 86)[0]} ${F(0, 86)[1] - 86 * K}) scale(${K})">
      <image href="masterplan-ink.png" width="2000" height="1124.4" ${lines === "all" ? "" : `mask="url(#${id})"`}/>
    </g></svg>`);
}
function axis(extent = 1) {  // the first line: copper, the idea, drawn by hand from the top of the plan down to him
  const [x, y0] = F(AXIS, 86), [, y1] = F(AXIS, 1045);
  add(`<svg class="abs" width="1920" height="1080" style="left:0;top:0"><line x1="${x}" y1="${y0}" x2="${x}" y2="${y0 + (y1 - y0) * extent}" stroke="#762F0B" stroke-width="2.4" stroke-linecap="round"/></svg>`);
}
const SPH = { copper: { w: 168, h: 193, c: 84.5, r: 44.5 }, blue: { w: 166, h: 191, c: 83.5, r: 44 } };
function sphere(name, x, y, r) {
  const k = r / SPH[name].r, o = SPH[name], L = x - o.c * k, T = y - o.c * k;
  add(`<img class="abs shadow" src="shadow-${name}.png" style="left:${L}px;top:${T}px;width:${o.w * k}px;height:${o.h * k}px">`);
  add(`<img class="abs" src="sphere-${name}.png" style="left:${L}px;top:${T}px;width:${o.w * k}px;height:${o.h * k}px">`);
}
const START = { copper: [640, 469, 47], blue: [1270, 469, 47] };
const HOME = { copper: [...F(285, 240), 38], blue: [...F(1756, 896), 38] };

function column(stage) {
  let h = `<div class="abs col"><div class="act">ACT ONE</div><div class="hair"></div><div class="title">The Architect</div><div class="copper" style="width:${stage >= 1 ? 100 : 40}%"></div>`;
  if (stage >= 2) h += `<div class="stmt">We design from above.<br>Not always for the person<br>who has to live<br>with the result.</div>`;
  add(h + `</div>`);
}
const LABELS = [[248, 140, "Ministry of Governance"], [335, 140, "Executive Direction"], [158, 211, "Ministry of Governance"],
  [421, 213, "Operational Risk"], [504, 184, "Ministry of Administration"], [159, 300, "Ministry of Governance"],
  [421, 302, "Ministry of Governance"], [502, 310, "Ministry of Governance"], [250, 359, "Operational Risk"],
  [332, 359, "Executive Direction"], [1761, 819, "Plant Interface Zone"]];
function labels() { for (const [x, y, t] of LABELS) { const [X, Y] = F(x, y); const w = t.startsWith("Plant"); add(`<div class="abs lbl" style="left:${X - (w ? 45 : 28)}px;top:${Y - 6}px;${w ? "width:90px" : ""}">${w ? t : t.replace(" of ", " of<br>").replace("Executive ", "Executive<br>").replace("Operational ", "Operational<br>")}</div>`); } }

// ---- The perspective fan: every line starts at the man, fans out, bends, and becomes the upright plan ----
const LM = { v: [106.1,129.6,374.1,458.3,541.0,590.0,625.9,669.1,708.6,758.4,792.8,875.5,894.6,920.9,939.2,1073.9,1093.0,1109.1,1131.0,1176.4,1213.8,1255.5,1295.0,1344.8,1381.4,1423.1,1462.7,1549.0,1631.0,1884.3,1907.0],
             h: [95.2,113.5,392.4,475.1,557.1,641.3,720.4,801.6,964.1,1022.7] };
const P0 = [955, 752];                                   // the man: the single point everything comes from
const ease = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
// A plan point (x in 2000 px space, v = 0 at the plan's bottom edge, 1 at its top) at stage t (0 = fan from the man, 1 = upright plan)
function warp(x, v, t, lin = false) {
  const [fx, fyTop] = F(x, 86), fyBot = F(x, 1045)[1];
  const e = ease(t);
  const B = [lerp(P0[0], fx, e), lerp(P0[1], fyBot, e)];             // the line's foot slides out of the man
  const T = [fx, fyTop];
  const C = [lerp(P0[0] + (fx - P0[0]) * 0.15, fx, e), lerp(lerp(P0[1], fyTop, 0.35), lerp(fyBot, fyTop, 0.5), e)];   // bends from a fan into an upright
  const w = lin ? v : Math.pow(v, 1 + 2.4 * (1 - e));                          // perspective: near the man the plan is foreshortened
  const u = 1 - w;
  return [u * u * B[0] + 2 * u * w * C[0] + w * w * T[0], u * u * B[1] + 2 * u * w * C[1] + w * w * T[1]];
}
function fan(t, grow = 1) {
  const ink = "#3a4b7a";
  let paths = "";
  const N = 40;
  for (const x of LM.v) {
    const pts = []; for (let i = 0; i <= N * grow; i++) pts.push(warp(x, i / N, t, grow < 1));
    paths += `<polyline points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${ink}" stroke-width="1.3" opacity="0.8"/>`;
  }
  if (grow >= 1) for (const y of LM.h) {
    const v = 1 - (y - 86) / 959;
    const xs = []; for (let x = 106; x <= 1907; x += 30) xs.push(warp(x, v, t));
    paths += `<polyline points="${xs.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${ink}" stroke-width="1.1" opacity="0.7"/>`;
  }
  const axis = []; for (let i = 0; i <= N * grow; i++) axis.push(warp(AXIS, i / N, t, grow < 1));
  paths += `<polyline points="${axis.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#762F0B" stroke-width="2.4"/>`;
  add(`<svg class="abs ink" width="1920" height="1080" style="left:0;top:0">${paths}</svg>`);
}


// ---- True one-point perspective (no warping: every line stays straight) ----
// Camera at the origin looking into the page. Horizon at the man's eye (y 770), vanishing point on him (x 955).
// The plan is a flat plane hinged along its bottom edge. phi = 90 deg: it lies overhead like a ceiling, every
// receding line converging on the man. phi = 0: upright, facing us, exactly the flat plan of still E.
const CAM = { f: 710, vx: 955, hy: 770, Zw: 10, yb: 1.225, a: 71 };
function proj(x, y, phi) {                      // x, y in the plan's 2000 px preview space
  const Xw = (x - AX) * K / CAM.a, h = (1045 - y) * K / CAM.a;
  const y3 = CAM.yb + h * Math.cos(phi), z3 = CAM.Zw - h * Math.sin(phi);
  return [CAM.vx + CAM.f * Xw / z3, CAM.hy - CAM.f * y3 / z3];
}
function persp(deg, opt = {}) {
  const phi = deg * Math.PI / 180, ink = "#3a4b7a";
  // The plane runs on past the plan's edge to infinity, so every receding line comes out of the man.
  // As it swings upright, that run pulls back into the plan's edge.
  const reach = 4000 * Math.pow(deg / 90, 3);               // how far past the edge (in plan px) the lines continue
  const far = (x) => proj(x, 1045 + reach, phi);
  let d = "";
  const L = (a, b, w, c, o) => `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" opacity="${o}"/>`;
  for (const x of LM.v) d += L(far(x), proj(x, 86, phi), 1.3, ink, 0.8);
  if (!opt.raysOnly) for (const y of [86, ...LM.h, 1045]) d += L(proj(106, y, phi), proj(1907, y, phi), 1.1, ink, 0.7);
  // cross lines out in the run toward him, tightening as they near the horizon
  if (reach > 1 && !opt.raysOnly) for (let k = 1; k <= 14; k++) { const y = 1045 + reach * (1 - Math.pow(0.72, k)); d += L(proj(106, y, phi), proj(1907, y, phi), 0.9, ink, 0.45); }
  d += L(far(AXIS), proj(AXIS, 86, phi), 2.4, "#762F0B", 1);
  // the horizon, at his eye, across the field; it passes behind him
  if (opt.horizon) d += `<path d="M420 ${CAM.hy - 16} H924 M986 ${CAM.hy - 16} H1545" stroke="#762F0B" stroke-width="1.6" opacity="0.9"/>`;
  // everything stays in the field and ends at the top of his head
  add(`<svg class="abs ink" width="1920" height="1080" style="left:0;top:0"><defs><clipPath id="field"><path d="M40 0 H1545 V754 H420 V640 H40 Z"/></clipPath></defs><g clip-path="url(#field)">${d}</g></svg>`);
}

const note = () => add(`<div class="abs note">…not as a metaphor.</div>`);
const cap = (t) => add(`<div class="cap">${t}</div>`);

if (s === "A") { add(`<div class="abs one">01</div>`); sphere("copper", ...START.copper); sphere("blue", ...START.blue); note(); cap("A · click 1, about 1 s: 01 glows in the field; the note settles low on the left"); }
if (s === "B") { sphere("copper", ...START.copper); sphere("blue", ...START.blue); note(); cap("B · click 1 end: 01 has sunk into the paper"); }
if (s === "C") {
  axis(1); plan({ v: THREE, h: [] }); column(0.5);
  sphere("copper", 560, 330, 44); sphere("blue", 1350, 520, 44); note();
  cap("C · click 2, about 1.5 s: the copper axis falls to his feet, then three lines; ACT ONE and The Architect; the spheres begin to move");
}
if (s === "D") {
  axis(1); plan({ v: [...THREE, ...SIX], h: CUTS }); column(1);
  sphere("copper", ...HOME.copper); sphere("blue", ...HOME.blue); note();
  cap("D · click 2 end: six lines and the horizontal cuts; the spheres have been herded into their zones");
}
if (s === "E") {
  axis(1); plan("all"); labels(); column(2);
  sphere("copper", ...HOME.copper); sphere("blue", ...HOME.blue); note();
  cap("E · click 3 end: the plan is complete; the statement sits in the column; the avenue in front of him stays empty");
}

if (s === "F1") { fan(0.0, 0.6); column(0.5); sphere("copper", 610, 440, 45); sphere("blue", 1300, 470, 45); note(); cap("F1 · click 2 begins: lines leave the man and fan out across the field; the spheres flinch"); }
if (s === "F2") { fan(0.45); column(1); sphere("copper", 470, 250, 42); sphere("blue", 1420, 610, 42); note(); cap("F2 · the fan bends: the plan lifts from the floor toward the upright; the spheres back away"); }
if (s === "F3") { fan(0.82); column(1); sphere("copper", ...HOME.copper); sphere("blue", ...HOME.blue); note(); cap("F3 · almost upright: the spheres are cornered in Governance and the Plant zone"); }

if (s === "P1") { persp(90); column(0.5); sphere("copper", 600, 430, 45); sphere("blue", 1300, 460, 45); note(); cap("P1 · the plan overhead, like a ceiling: every receding line converges on the man"); }
if (s === "P2") { persp(55); column(1); sphere("copper", 500, 280, 42); sphere("blue", 1400, 590, 42); note(); cap("P2 · the plane swings down toward upright; the vanishing point climbs away from him"); }
if (s === "P3") { persp(22); column(1); sphere("copper", ...HOME.copper); sphere("blue", ...HOME.blue); note(); cap("P3 · almost upright: the lines are nearly parallel; the spheres are cornered"); }
if (s === "P4") { persp(0); column(1); sphere("copper", ...HOME.copper); sphere("blue", ...HOME.blue); note(); cap("P4 · upright: the drawn lines now sit exactly on the plan of still E"); }

if (s === "R1") { persp(90, { raysOnly: true }); sphere("copper", 610, 440, 45); sphere("blue", 1300, 470, 45); note(); cap("R1 · click 2: the rays leave the man"); }
if (s === "R2") { persp(90, { horizon: true }); column(0.5); sphere("copper", 560, 400, 45); sphere("blue", 1340, 470, 45); note(); cap("R2 · they find the horizon: a line at his eye; the cross lines tighten toward it"); }

if (s === "G") {        // Still E, plus: every vertical line of the plan joined to the man
  axis(1); plan("all"); labels(); column(2);
  sphere("copper", ...HOME.copper); sphere("blue", ...HOME.blue); note();
  const head = [955, 752];
  let d = "";
  for (const x of LM.v) { const [X, Y] = F(x, 1045); d += `<line x1="${X.toFixed(1)}" y1="${Y.toFixed(1)}" x2="${head[0]}" y2="${head[1]}" stroke="#3a4b7a" stroke-width="1" opacity="0.75"/>`; }
  add(`<svg class="abs ink" width="1920" height="1080" style="left:0;top:0">${d}</svg>`);
  cap("G · every vertical of the plan joined to the man");
}
</script>
</body>
</html>
