<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data and AI in Sustainable Digital Transformation</title>
<!--
  Act 0. Edu's title slide, set on a fixed 1920 by 1080 stage so it scales to any screen.
  The man is the measure of the drawing: no title type ever sits above the foot datum (y 936, his soles at 928 + 8).
  Layout (Edu, 30 Sep): title bottom left, name top right with the role under it, dsm-firmenich bottom right.
  On the click (Space, Right arrow, Page Down, Enter) opening.mp4 starts under the man; PEOPLE | PLANET | PROGRESS,
  centred on him with the occasion line, fades out first; then the title (one line and its subtitle, one group) shrinks and sinks down the
  left margin to its place. The group is laid out once at its starting size and only transformed, so its letters never
  change shape; the shrink finishes before it reaches the man's height, so it never crosses him.
  Runs offline: open this file with a double click. R resets. F is fullscreen.
-->
<script src="gsap.min.js"></script>
<style>
  :root{ --paper:#ead9bc; --rust:#843b18; --ink:#171717; --blue:#456d8b; }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9d4ba}
  body{font-family:Arial,Helvetica,sans-serif}

  /* One fixed stage, scaled to fit the window */
  .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#ebd7bd}

  /* The opening film sits underneath. It is hidden until the click. */
  .film{position:absolute;left:0;top:95px;width:1920px;height:1080px;object-fit:cover}   /* shifted down with the man */

  .film2{position:absolute;left:252.2px;top:148.6px;width:1404px;height:661.7px;object-fit:fill;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent),linear-gradient(transparent,#000 36px,#000 calc(100% - 36px),transparent);
    -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent),linear-gradient(transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-composite:intersect}
  /* The film starts 95 px down; this blends its top edge into the paper above it */
  .seam{position:absolute;left:0;top:0;width:1920px;height:175px;pointer-events:none;background:linear-gradient(#ebd7bd 0,#ebd7bd 95px,rgba(235,215,189,0) 175px)}

  /* Edu's paper, exactly as in his file, on its own layer so it can give way to the film */
  .paper{position:absolute;inset:0;background:#e9d4ba}   /* the film's own paper tone, so nothing shifts on the click */
  .grid{
    position:absolute;inset:0;opacity:.18;pointer-events:none;
    background:linear-gradient(rgba(115,78,38,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(115,78,38,.14) 1px,transparent 1px);
    background-size:173px 173px;
    -webkit-mask-image:linear-gradient(to bottom,black 0%,transparent 32%,transparent 68%,black 100%);
    mask-image:linear-gradient(to bottom,black 0%,transparent 32%,transparent 68%,black 100%);
  }
  .chem{position:absolute;right:5%;top:4%;font:18px Georgia,serif;color:rgba(105,74,42,.19);transform:rotate(-3deg);letter-spacing:.12em}
  .chem::after{content:"";position:absolute;width:180px;height:90px;border:1px solid rgba(105,74,42,.16);border-radius:42%;left:30px;top:-18px;transform:rotate(27deg)}

  .age{position:absolute;inset:0;width:1920px;height:1080px;mix-blend-mode:multiply;pointer-events:none}
  .lit{position:absolute;inset:0;width:1920px;height:1080px;mix-blend-mode:screen;pointer-events:none}

  /* The man: a multiply layer (white is transparent), placed on the video's own man */
  .man{position:absolute;left:743px;top:750px;width:257px;height:184px;mix-blend-mode:multiply;pointer-events:none}

  /* ---------- Type: static, in its final place from the first frame ---------- */
  .type{position:absolute;inset:0}
  .t{position:absolute;display:block;white-space:nowrap}
  .rust{color:var(--rust)} .dark{color:var(--ink)}

  /* Title: one group, bottom left at rest (entirely below the foot datum, y 936). It is laid out at its starting
     size (x 1.875) and scaled down to rest, so every frame is a downscale of the same sharp raster. */
  .tgroup{position:absolute;left:96px;top:954px;transform-origin:0 0;will-change:transform}
  .tgroup .rule-left{position:absolute;left:-43px;top:-4px;height:131px;border-left:2px solid rgba(132,59,24,.78)}
  .title{left:0;top:0;font:60px/1 Georgia,"Times New Roman",serif;letter-spacing:-.02em}
  .d-sub{left:4px;top:82px;font:italic 35.6px/1 Georgia,"Times New Roman",serif;color:var(--ink)}

  /* Identity, top right, right-justified to x 1824 (the logo's right edge): the name, the role directly beneath.
     Its copper rule sits 37 px left of the block, as the logo's does. */
  .idblock{position:absolute;right:96px;top:44px;text-align:right}
  .idblock .t{position:static}
  .idblock .rule-right{position:absolute;left:-37px;top:0;height:60px;border-left:1px solid rgba(132,59,24,.75)}
  .name{font:32px/1 Georgia,"Times New Roman",serif;color:var(--ink)}
  .role{margin-top:14px;font:14px/1 Arial,Helvetica,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}

  /* The official logo (dsm-firmenich Logo Primary Digital, vector), bottom right; its rule starts below the datum */
  .company{left:1594px;top:968px;width:230px}
  .company img{display:block;width:100%;height:auto}
  .rule-right::after,.rule-logo::after{content:"";position:absolute;left:-6px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--rust)}
  .rule-logo{position:absolute;left:1557px;top:944px;height:78px;border-left:2px solid rgba(132,59,24,.85)}

  /* The brand line and the occasion: centred on the man before the click; they fade out before the title moves */
  .people{left:905px;top:958px;transform:translateX(-50%);color:var(--rust);font:700 24.5px Arial,Helvetica,sans-serif;letter-spacing:.30em}
  .event{left:905px;top:1003px;transform:translateX(-50%);color:var(--blue);font:17.5px Arial,Helvetica,sans-serif;letter-spacing:.20em}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video class="film" id="film" src="opening.mp4" muted playsinline preload="auto" style="opacity:0"></video>
  <!-- Second clip: placed so its first frame registers exactly on the opening film's last frame
       (measured: scale 0.788 and offset 197, 43 in the 1500 x 846 film, correlation 0.89) -->
  <video class="film2" id="film2" src="clip2.mp4" muted playsinline preload="auto" style="opacity:0"></video>
  <div class="seam"></div>

  <div class="paper" id="paper"></div>
  <!-- Aged archival paper (tools/make_paper.py): lies over the paper and the film, so it holds through the click -->
  <img class="age" src="paper-age.png" alt="">
  <img class="lit" src="paper-light.png" alt="">

  <img class="man" id="man" src="man.png" alt="">

  <div class="type" id="type">
    <div class="tgroup" id="tgroup">
      <div class="rule-left"></div>
      <span class="t title"><span class="rust">Data and AI in Sustainable Digital</span> <span class="dark">Transformation</span></span>
      <span class="t d-sub">From Brasília to the Plant Floor</span>
    </div>

    <div class="idblock">
      <div class="rule-right"></div>
      <span class="t name">Eduardo Sopalda</span>
      <span class="t role">D&amp;T · Global Data Governance Lead</span>
    </div>

    <div class="rule-logo" id="ruleLogo"></div>
    <span class="t company"><img src="logo.svg" alt="dsm-firmenich"></span>

    <span class="t people" id="people">PEOPLE&nbsp;&nbsp;|&nbsp;&nbsp;PLANET&nbsp;&nbsp;|&nbsp;&nbsp;PROGRESS</span>
    <span class="t event" id="event">AUTOMA CHEM 2026&nbsp;&nbsp;·&nbsp;&nbsp;ESTREL BERLIN&nbsp;&nbsp;·&nbsp;&nbsp;26 OCTOBER 2026&nbsp;&nbsp;·&nbsp;&nbsp;9:40</span>
  </div>
</div>

<script>
  const stage = document.getElementById("stage"), people = document.getElementById("people"), event = document.getElementById("event"), tgroup = document.getElementById("tgroup");
  const film = document.getElementById("film"), paper = document.getElementById("paper"), man = document.getElementById("man");

  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  };
  addEventListener("resize", fit); fit();


  // The title's move, solved so it never crosses the man (tools: path checked frame by frame against his box):
  // the brand line fades out first (0.2 to 1.2 s); then, from 1.4 s, the title shrinks (1.6 s) and sinks (3.2 s) together;
  // the shrink finishes first, so it is already at its final size when it passes the man's height, 19 px left of his shadow.
  // Scale is interpolated by ratio (log), so the shrink reads even. One ease, power3.inOut: no bounce, no overshoot.
  const S0 = 60 / 32, DY = 160 - 954;                         // start: one line at the title-slide height; rest: y 954
  const p3 = gsap.parseEase("power3.inOut");
  const evenShrink = (p) => (Math.pow(S0, -p3(p)) - 1) / (1 / S0 - 1);   // power3.inOut applied to log(scale)
  const titleStart = () => gsap.set(tgroup, { transformOrigin: "0 0", y: DY, scale: 1, force3D: true });
  titleStart();
  let started = false, tl = null;
  function begin() {
    if (started) return;
    started = true;
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    film.currentTime = 0;
    film.play();
    tl = gsap.timeline()
      .to(film, { opacity: 1, duration: 0.01 }, 0)
      .to(paper, { opacity: 0, duration: 1.2, ease: "sine.inOut" }, 0.1)
      .to(man, { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 0.7)   // the film's own man takes over, same place
      .to([people, event], { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 0.2)
      .to(tgroup, { scale: 1 / S0, duration: 1.6, ease: evenShrink }, 1.4)
      .to(tgroup, { y: 0, duration: 3.2, ease: "power3.inOut" }, 1.4);
    if (calm) tl.progress(1);
    window.__anims = [tl];
  }
  // Second click: the next clip. Its first frame is the opening film's last frame, so it only starts from there.
  // If the click comes early, the opening film finishes at triple speed first, then hands over.
  const film2 = document.getElementById("film2");
  let second = false;
  function next() {
    if (!started || second) return;
    second = true;
    const go = () => {
      film.playbackRate = 1;
      film2.currentTime = 0;
      film2.play();
      window.__anims2 = [gsap.timeline()
        // The two clips draw the same lines very slightly differently (each was generated on its own),
        // so a short dissolve lets each line melt into its twin instead of shimmering on a hard cut.
        .fromTo(film2, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, 0)
        .fromTo(man, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, 0)   // the man stays: this clip does not contain him
        .to(film, { opacity: 0, duration: 1.2, ease: "sine.inOut" }, 0.2)];
    };
    if (film.ended || film.currentTime >= film.duration - 0.05) go();
    else { film.playbackRate = 3; film.addEventListener("ended", go, { once: true }); }
  }
  function reset() {
    started = false;
    tl && tl.kill();
    film.pause(); film.currentTime = 0; film.playbackRate = 1;
    second = false; film2.pause(); film2.currentTime = 0;
    (window.__anims2 || []).forEach((a) => a.kill());
    gsap.set([film, film2], { opacity: 0 });
    gsap.set([paper, man, people, event], { opacity: 1 });
    titleStart();
  }
  addEventListener("keydown", (e) => {
    if ([" ", "ArrowRight", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); if (!e.repeat) (started ? next() : begin()); }
    else if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  });
  // The film holds on its last frame when it ends: no loop, nothing moves on by itself.
  film.addEventListener("ended", () => film.pause());
  film2.addEventListener("ended", () => { film2.pause(); if (parent !== window) parent.postMessage({ deck: "opening-done" }, "*"); });   // tells deck.html the opening is still
  // When this page runs inside deck.html, the deck owns the keyboard and relays keys here.
  addEventListener("message", (e) => { const k = e.data && e.data.deckKey; if (k) dispatchEvent(new KeyboardEvent("keydown", { key: k, cancelable: true })); });
</script>
</body>
</html>
